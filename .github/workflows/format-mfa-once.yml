name: Format MFA backend once

on:
  push:
    branches:
      - feat/mfa-stage3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mfa-stage3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Apply gofmt
        run: gofmt -w backend
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: apply gofmt to MFA backend"
          git push origin HEAD:feat/mfa-stage3
