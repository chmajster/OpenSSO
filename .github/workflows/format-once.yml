name: Format backend once

on:
  push:
    branches:
      - feat/foundation-oidc

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/foundation-oidc
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Apply gofmt
        run: gofmt -w backend
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: apply final gofmt"
          git push origin HEAD:feat/foundation-oidc
