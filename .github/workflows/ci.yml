name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.mod
      - run: go mod tidy && git diff --exit-code
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/opensso
      - run: go build ./cmd/healthcheck
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=test-password OPENSSO_BOOTSTRAP_TOKEN=0123456789abcdefghijklmnopqrstuv docker compose config >/dev/null


  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: e2e-postgres-password
      OPENSSO_BOOTSTRAP_TOKEN: 0123456789abcdefghijklmnopqrstuvwxyz
      OPENSSO_PUBLIC_URL: http://localhost:8080
      OPENSSO_E2E_URL: http://localhost:8080
      OPENSSO_COOKIE_SECURE: "false"
      OPENSSO_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: bash scripts/e2e-foundation.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
