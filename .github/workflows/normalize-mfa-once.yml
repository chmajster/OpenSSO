name: Normalize MFA backend once

on:
  push:
    branches:
      - feat/mfa-stage3

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mfa-stage3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Normalize modules and formatting
        working-directory: backend
        run: |
          go mod tidy
          gofmt -w .
      - name: Commit normalized backend
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "build: normalize MFA dependencies and Go formatting"
          git push origin HEAD:feat/mfa-stage3
